[project]
name = "ledgerline"
version = "0.1.0"
description = "Household records ingestion agent for Ledgerline Wealth"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ledgerline = "ledgerline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgerline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
